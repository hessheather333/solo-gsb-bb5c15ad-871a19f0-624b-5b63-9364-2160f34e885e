<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL 重写规则调试台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>🔁 URL 重写规则调试台</h1>
      <p class="subtitle">定义按顺序执行的匹配 / 改写 / 重定向规则，逐步模拟一条请求路径的完整命运</p>
    </div>
  </header>

  <main class="layout">
    <!-- 左：规则编辑与请求输入 -->
    <section class="panel panel-left">
      <div class="panel-head">
        <h2>规则链</h2>
        <div class="example-box">
          <select id="exampleSelect" aria-label="选择示例"></select>
          <button id="loadExampleBtn" class="btn btn-ghost" type="button">载入示例</button>
        </div>
      </div>

      <div class="editor-wrap" id="editorWrap">
        <div class="gutter" id="gutter"></div>
        <textarea
          id="rulesEditor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          wrap="off"
          placeholder='REWRITE  ^/old/(.*)$  /new/$1  next&#10;REDIRECT ^/home$     /          301&#10;# 以 # 开头为注释'></textarea>
      </div>

      <div id="errorList" class="error-list" hidden></div>

      <div class="request-box">
        <label class="field">
          <span class="field-label">请求路径</span>
          <input id="pathInput" type="text" value="/" spellcheck="false" placeholder="/users/42" />
        </label>
        <div class="request-row">
          <label class="field field-narrow">
            <span class="field-label">步数上限</span>
            <input id="maxStepsInput" type="number" min="1" max="500" value="100" />
          </label>
          <label class="checkbox-field">
            <input id="followRedirectsInput" type="checkbox" />
            <span>跟随站内重定向继续模拟</span>
          </label>
        </div>
        <div class="actions">
          <button id="runBtn" class="btn btn-primary" type="button">▶ 运行调试</button>
          <button id="copyBtn" class="btn btn-secondary" type="button" disabled>📋 复制调试结果</button>
          <span id="ruleCount" class="rule-count"></span>
        </div>
      </div>
    </section>

    <!-- 右：逐步执行轨迹 -->
    <section class="panel panel-right">
      <div class="panel-head">
        <h2>执行轨迹</h2>
      </div>

      <div id="summary" class="summary" hidden>
        <div class="summary-main">
          <span id="statusBadge" class="status-badge">—</span>
          <div class="summary-url">
            <span class="summary-label">最终 URL</span>
            <code id="finalUrl">—</code>
          </div>
        </div>
        <div class="summary-meta">
          <span id="finishReason" class="tag">—</span>
          <span id="stepMeta" class="muted">—</span>
        </div>
        <div id="locationLine" class="location-line" hidden>
          <span class="summary-label">Location 响应头</span>
          <code id="locationValue">—</code>
        </div>
      </div>

      <div id="trace" class="trace">
        <div class="placeholder">
          <p>👈 在左侧编写规则并输入请求路径</p>
          <p class="muted">点击「运行调试」后，这里会按顺序展示每次匹配、捕获组变量变化与最终响应</p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
